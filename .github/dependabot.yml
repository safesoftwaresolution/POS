version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns: ["org.springframework.boot*", "org.springframework*"]
      aws-sdk:
        patterns: ["software.amazon.awssdk*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ["react", "react-dom", "react-router*", "@types/react*"]
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    # El proyecto compila y se prueba en Java 21 (pom, CI y Dockerfile). Subir de JDK es una migracion
    # deliberada, no un bump automatico: la imagen no se prueba en CI.
    ignore:
      - dependency-name: eclipse-temurin
        versions: [">=22"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Todas las acciones juntas: editan el mismo ci.yml y por separado chocan entre si.
    groups:
      actions:
        patterns: ["*"]
