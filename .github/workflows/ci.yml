name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

# Una ejecucion por rama: una nueva cancela la anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Tests + jacoco. Los V*MigrationSqlTest corren Flyway sobre H2; no hace falta Docker.
      - name: mvn verify
        run: ./mvnw -B -ntp verify
      - name: Reportes de test
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7
      - name: Cobertura (jacoco)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
          retention-days: 7

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # oxlint hoy emite avisos (no errores); un error de lint falla el job.
      - run: npm run lint
      - run: npm run build

  harness:
    name: Arnés y documentación (.ai/init.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Valida que cada módulo del código tenga spec y que los documentos globales existan. Los tests ya corren en el job backend.
      - run: bash .ai/init.sh --skip-tests
