services:
  db:
    image: postgres:16-alpine
    container_name: app-db-prod
    environment:
      POSTGRES_DB: ${DB_NAME:-app_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-app_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: prod
    container_name: app-backend-prod
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-app_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_PROFILES_ACTIVE: prod
      # --- Sesion y seguridad ---
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET (>= 32 bytes)}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      # Cookies Secure por defecto: el SPA debe servirse por HTTPS (proxy inverso). Solo para probar sin TLS: false.
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-true}
      # URL publica del SPA: enlaces de los correos y unico origen CORS permitido.
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:?Define APP_FRONTEND_URL (URL publica del frontend)}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-${APP_FRONTEND_URL}}
      # Cuenta SUPER_ADMIN inicial; sin esta variable no se siembra ninguna.
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:-}
      # --- Correo (verificacion de cuenta, alertas). "log" no envia nada: usa smtp en produccion ---
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # --- Facturacion electronica ---
      BILLING_PROVIDER: ${BILLING_PROVIDER:-factus}
      BILLING_ENCRYPTION_KEY: ${BILLING_ENCRYPTION_KEY:-}
      FACTUS_URL_SANDBOX: ${FACTUS_URL_SANDBOX:-https://api-sandbox.factus.com.co}
      FACTUS_URL_PRODUCTION: ${FACTUS_URL_PRODUCTION:-https://api.factus.com.co}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-pos-storage}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    restart: always
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata-prod:
