# Development Profile (H2 File-Based Database by default, overridden by env vars in Docker)
# Los datos persisten entre reinicios (ej. Spring Boot DevTools) en backend/data/app_db.*.
# Borra la carpeta backend/data/ manualmente si necesitas arrancar con una base de datos limpia.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/app_db;MODE=PostgreSQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
# Flyway construye y posee el schema tambien en dev; Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=true

# La configuracion de Flyway (enabled/locations/baseline/clean) vive en application.properties.

# Local development JWT secret fallback (only active in dev profile)
security.jwt.secret=${JWT_SECRET:dev_secret_key_only_for_local_environment_testing_purposes_must_be_32_bytes}

