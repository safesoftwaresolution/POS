# ==============================================================================
# Perfil de Produccion
# ------------------------------------------------------------------------------
# Flyway migra el schema; Hibernate solo lo valida. Nada destructivo permitido.
# El resto de la configuracion (datasource, JWT, Factus, R2...) llega por
# variables de entorno y hereda de application.properties.
# ==============================================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# La consola H2 nunca debe exponerse en produccion.
spring.h2.console.enabled=false

# La documentacion OpenAPI/Swagger expone todo el contrato de la API: apagada en produccion.
# SWAGGER_ENABLED=true la enciende de forma temporal (por ejemplo, para depurar un cliente).
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# --- Capacidad (ver docs/_deployment.md, "Capacidad y limites") ---
# Pool de conexiones: 20 por replica. Postgres trae max_connections=100, asi que cubre hasta ~4 replicas.
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
# Falla rapido (10 s) en vez de dejar colgado el hilo HTTP cuando el pool esta saturado.
spring.datasource.hikari.connection-timeout=10000
# Solo para depurar fugas de conexiones (ms); 0 = apagado.
spring.datasource.hikari.leak-detection-threshold=${HIKARI_LEAK_DETECTION_MS:0}

# Tope de 30 s por consulta JDBC (JdbcClient/JdbcTemplate: reportes y back-office) para que un
# reporte pesado no acapare conexiones del pool que necesitan las ventas.
spring.jdbc.template.query-timeout=30
