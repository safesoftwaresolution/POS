# ==============================================================================
# Perfil de Produccion
# ------------------------------------------------------------------------------
# Flyway migra el schema; Hibernate solo lo valida. Nada destructivo permitido.
# El resto de la configuracion (datasource, JWT, Factus, R2...) llega por
# variables de entorno y hereda de application.properties.
# ==============================================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# La consola H2 nunca debe exponerse en produccion.
spring.h2.console.enabled=false
