spring.application.name=app.pos
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Carga backend/.env como si fuera un archivo de properties (ya tiene sintaxis KEY=VALUE
# compatible). Reemplaza a spring-dotenv, que no estaba surtiendo efecto en este entorno
# (las variables R2_* seguian llegando vacias). "optional:" evita fallar el arranque si
# el archivo no existe (ej. en Docker, donde las variables llegan por environment/env_file).
# Las variables de entorno reales del sistema/proceso siempre tienen prioridad sobre esto.
spring.config.import=optional:file:.env[.properties]

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
# Flyway es el UNICO dueno del schema (dev + prod). Hibernate solo valida y aborta si hay drift.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Flyway (gobernanza comun a todos los perfiles; el perfil 'test' lo desactiva)
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Security configurations
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
security.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
# Ventana de gracia (ms) para reintentos de /auth/refresh: un refresh token recien rotado
# vuelto a presentar dentro de esta ventana NO revoca la sesion (evita cerrar sesion por
# reintentos de red). Fuera de la ventana se trata como reuso (robo). 0 = deteccion estricta.
security.jwt.refresh-reuse-grace-ms=${JWT_REFRESH_REUSE_GRACE_MS:15000}
security.jwt.cookie-name=${JWT_COOKIE_NAME:jwt_token}
security.jwt.refresh-cookie-name=${JWT_REFRESH_COOKIE_NAME:refresh_token}
security.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
security.jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:Strict}
# Vigencia del token de verificacion de correo emitido en el auto-registro (ms). Default 24h.
security.email-verification.expiration-ms=${EMAIL_VERIFICATION_EXPIRATION_MS:86400000}

# Billing Provider Strategy (factus, mock, siigo, etc.)
billing.provider=${BILLING_PROVIDER:factus}
# Clave AES-256 (32 bytes en Base64) con la que se cifran en la BD los secretos de facturacion
# de cada local (client_secret y password de Factus). Generar con: openssl rand -base64 32
billing.encryption-key=${BILLING_ENCRYPTION_KEY:}

# Email Provider Strategy (log = solo consola/dev, smtp = envio real)
email.provider=${EMAIL_PROVIDER:log}
email.from=${EMAIL_FROM:no-reply@propos.app}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# URL publica del frontend, usada para construir enlaces de verificacion de correo
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

# Factus API Configuration
# Las credenciales (client_id, client_secret, usuario, contrasena) y el rango de numeracion NO se
# configuran aqui: el SUPER_ADMIN los carga por local en la base de datos (tabla store_billing_config).
# Aqui solo van las URLs publicas de cada entorno; cada local usa la de su entorno activo.
factus.url.sandbox=${FACTUS_URL_SANDBOX:https://api-sandbox.factus.com.co}
factus.url.production=${FACTUS_URL_PRODUCTION:https://api.factus.com.co}
factus.api-version=${FACTUS_API_VERSION:v2}

# SpringDoc / Swagger UI configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.deep-linking=true
springdoc.swagger-ui.display-operation-id=false
springdoc.swagger-ui.default-models-expand-depth=2
# Cloudflare R2 Object Storage Configuration
cloudflare.r2.account-id=${R2_ACCOUNT_ID:}
cloudflare.r2.access-key-id=${R2_ACCESS_KEY_ID:}
cloudflare.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
cloudflare.r2.bucket-name=${R2_BUCKET_NAME:pos-storage}
cloudflare.r2.public-url=${R2_PUBLIC_URL:https://pub-example.r2.dev}

# Multipart file upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
