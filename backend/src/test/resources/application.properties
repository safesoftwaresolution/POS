# H2 Test Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Hibernate (create-drop) es dueno del schema de test. Flyway se prueba aparte:
# los V*MigrationSqlTest invocan Flyway a mano sobre su propia H2 en memoria.
spring.flyway.enabled=false

# JWT properties for test
security.jwt.secret=9a2f34af8b302c340b12e345f67a89bc23d45e6789f01ab23cd45ef6789a01bc
security.jwt.expiration-ms=900000
security.jwt.refresh-expiration-ms=604800000
security.jwt.refresh-reuse-grace-ms=15000

# Clave de cifrado de facturacion solo para tests (32 bytes en Base64)
billing.encryption-key=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
